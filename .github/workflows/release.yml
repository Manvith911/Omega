name: draft release

on:
  push:
    tags:
      - 'v*'

jobs:
  draft:
    runs-on: windows-latest
    # main purpose is to demonstrate that the unsigned installer carries all
    # content, can be downloaded, and runs the test suite on its own machine.
    env:
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: install
        run: npm ci --no-audit --no-fund

      - name: postinstall
        run: npm run postinstall

      - name: verify storage
        run: npm run verify:storage

      - name: verify freeze
        run: npm run verify:freeze

      - name: build
        run: npx electron-vite build

      - name: run typecheck
        run: npm run typecheck

      - name: package
        run: npx electron-builder --win --publish never

      - name: list artifacts
        run: |
          powershell -Command 'Get-ChildItem -Path release -Recurse | Select-Object FullName,Length | Sort-Object Length -Descending | Format-Table -AutoSize'

      - name: write release notes
        run: |
          gh release create ${{ github.ref_name }} --draft --title "Omega ${{ github.ref_name }}" --notes-file - <<EOF
            Built from ${{ github.sha }}. Test suite ran: storage and freeze verification, then a build and typecheck.

            To install locally, download the `.exe` and run it to install Omega, then launch it.
            To build macOS or Linux, run `npm run build:mac` or `npm run build:linux`.
          EOF
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
